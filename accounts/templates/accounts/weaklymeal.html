{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Meal Plan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(120deg, #d4fc79, #96e6a1);
    font-family: 'Poppins', sans-serif;
    padding: 40px 15px;
}
.container-box {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
input {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid #ddd;
}
button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-weight: 600;
    background: linear-gradient(90deg, #6f3cff, #b34cff);
    color: white;
}
</style>
</head>

<body>

<form method="POST" id="mealForm">
  {% csrf_token %}

  <div class="container-box">
    <h1 class="text-center">🥗 Weekly Meal Plan</h1>
    <label class="fw-bold mt-3">Kondisi Kesehatan</label>
    <input id="penyakitInput" placeholder="contoh: diabetes, asma" required>
    <label class="fw-bold mt-3">Alergi Makanan</label>
    <input id="alergiInput" placeholder="contoh: seafood, susu" required>
    <input type="hidden" name="meal_plan" id="hiddenMealPlan">
    <button type="button" id="generateBtn" class="mt-4">⚙️ Buat Meal Plan</button>
    <div id="result" class="mt-4" style="display:none;"></div>
    <button type="button" id="downloadBtn" class="mt-3" style="display:none;">⬇️ Unduh Meal Plan</button>
    <button type="submit" id="saveBtn" class="mt-3" style="display:none;"> 💾 Simpan ke Sistem</button>
    <a href="{% url 'accounts:dashboard' %}" class="btn btn-link mt-3">← Kembali ke Dashboard</a>
  </div>
</form>

<script>
const penyakitInput = document.getElementById("penyakitInput");
const alergiInput = document.getElementById("alergiInput");
const result = document.getElementById("result");
const hiddenMealPlan = document.getElementById("hiddenMealPlan");
const mealForm = document.getElementById("mealForm");

const kondisiData = [
  { keywords:["diabetes"], avoid:["gula","minuman manis"], focus:["serat","protein","karbo kompleks"] },
  { keywords:["hipertensi","darah tinggi"], avoid:["garam","makanan instan"], focus:["sayur","buah"] },
  { keywords:["asma","sesak"], avoid:["makanan olahan"], focus:["antioksidan"] }
];

const mealDB = {
  sarapan:["Oatmeal","Telur rebus","Smoothie"],
  siang:["Nasi merah + ikan","Sup sayur","Tumis tahu"],
  malam:["Ikan panggang","Sup bening","Salad"]
};

document.getElementById("generateBtn").addEventListener("click", () => {
  const penyakit = penyakitInput.value.toLowerCase().trim();
  const alergi = alergiInput.value.toLowerCase().trim();

  if (!penyakit || !alergi) {
    alert("Semua field wajib diisi");
    return;
  }

  let focus = [], avoid = [];
  kondisiData.forEach(k => {
    if (k.keywords.some(w => penyakit.includes(w))) {
      focus.push(...k.focus);
      avoid.push(...k.avoid);
    }
  });

  if (!focus.length) {
    focus = ["makan seimbang","protein cukup"];
    avoid = ["gula berlebih"];
  }

  let html = `
    <h5>🎯 Fokus Nutrisi</h5>
    <ul>${focus.map(f=>`<li>${f}</li>`).join("")}</ul>

    <h5>🚫 Hindari</h5>
    <ul>${avoid.map(a=>`<li>${a}</li>`).join("")}</ul>

    <h5 class="mt-3">📅 Meal Plan 7 Hari</h5>
  `;

  for (let i=1;i<=7;i++){
    html += `
      <p><b>Hari ${i}</b><br>
      Sarapan: ${mealDB.sarapan[i%3]}<br>
      Siang: ${mealDB.siang[i%3]}<br>
      Malam: ${mealDB.malam[i%3]}</p>
    `;
  }

  result.style.display = "block";
  result.innerHTML = html;
  hiddenMealPlan.value = html;
  document.getElementById("downloadBtn").style.display = "block";

});
</script>

<script>
document.getElementById("downloadBtn").addEventListener("click", () => {
  const content = document.getElementById("hiddenMealPlan").value;

  if (!content) {
    alert("Meal plan belum tersedia");
    return;
  }

  // Bersihkan HTML → teks biasa
  const text = content
    .replace(/<br>/g, "\n")
    .replace(/<\/p>/g, "\n\n")
    .replace(/<[^>]*>/g, "");

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "weekly_meal_plan.txt";
  document.body.appendChild(a);
  a.click();

  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>



</body>
</html>
