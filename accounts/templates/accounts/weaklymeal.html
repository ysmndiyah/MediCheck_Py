{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Meal Plan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(120deg, #d4fc79, #96e6a1);
    font-family: 'Poppins', sans-serif;
    padding: 40px 15px;
}
.container-box {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
input {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid #ddd;
}
button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-weight: 600;
    background: linear-gradient(90deg, #6f3cff, #b34cff);
    color: white;
}
</style>
</head>

<body>

<form method="POST">
    {% csrf_token %}

<div class="container-box">
<h1 class="text-center">🥗 Weakly Meal Plan</h1>
<label class="fw-bold mt-3">Kondisi Kesehatan</label>
<input id="penyakitInput" placeholder="contoh: diabetes, asma" required>
<label class="fw-bold mt-3">Alergi Makanan</label>
<input id="alergiInput" placeholder="contoh: seafood, susu" required>

<!-- HIDDEN INPUT -->
<input type="hidden" name="kondisi_kesehatan" id="hiddenKondisi">
<input type="hidden" name="alergi_makanan" id="hiddenAlergi">

<button type="button" id="generateBtn" class="mt-4">Buat Meal Plan Mingguan</button>

<div id="result" class="mt-4" style="display:none;"></div>

<button type="submit" id="btnSimpan" class="mt-4" style="display:none;">💾 Simpan Weakly Meal Plan</button>

<a href="{% url 'accounts:dashboard' %}" class="btn btn-link mt-3">
← Kembali ke Dashboard
</a>
</div>
</form>

<script>
/* ================= KNOWLEDGE BASE ================= */
const kondisiData = [
  {
    keywords: ["diabetes"],
    avoid: ["gula", "minuman manis"],
    focus: ["serat", "protein", "karbo kompleks"]
  },
  {
    keywords: ["hipertensi", "darah tinggi"],
    avoid: ["garam", "makanan instan"], 
    focus: ["sayur", "buah", "kalium"]
  },
  {
    keywords: ["jantung"],
    avoid: ["lemak jenuh", "gorengan"],
    focus: ["ikan", "oatmeal", "lemak sehat"]
  },
  {
    keywords: ["asma", "sesak"],
    avoid: ["makanan olahan"],
    focus: ["antioksidan", "vitamin c"]
  }
];

/* ================= DATABASE MENU ================= */
const mealDB = {
  sarapan: [
    "Oatmeal dengan buah",
    "Telur rebus & roti gandum",
    "Smoothie sayur",
    "Yogurt rendah lemak",
    "Bubur kacang hijau"
  ],
  siang: [
    "Nasi merah + ikan kukus",
    "Salad ayam panggang",
    "Sup sayur bening",
    "Tumis tahu tempe",
    "Sop ayam rendah garam"
  ],
  malam: [
    "Sup sayur",
    "Ikan panggang",
    "Tumis brokoli",
    "Salad sayur",
    "Telur rebus & sayur"
  ]
};

/* ================= GENERATE ================= */
document.getElementById("generateBtn").addEventListener("click", () => {
  const penyakit = document.getElementById("penyakitInput").value.toLowerCase();
const alergiText = document.getElementById("alergiInput").value.toLowerCase();

if (!penyakit || !alergiText) {
  alert("Penyakit dan alergi makanan wajib diisi");
  return;
}

const alergiList = alergiText
  .split(/,|dan|;/)
  .map(a => a.trim())
  .filter(a => a);

  let avoid = [];
  let focus = [];

  kondisiData.forEach(k => {
    if (k.keywords.some(w => penyakit.includes(w))) {
      avoid.push(...k.avoid);
      focus.push(...k.focus);
    }
  });

    if (focus.length === 0) {
  focus = ["makanan seimbang", "protein cukup", "sayur dan buah"];
  avoid = ["makanan ultra-proses", "gula berlebih"];
}

  let html = `<h5>🎯 Fokus Nutrisi</h5>
  <ul>${focus.map(f => `<li>${f}</li>`).join("")}</ul>

  <h5>🚫 Perlu Dihindari</h5>
  <ul>${avoid.map(a => `<li>${a}</li>`).join("")}</ul>`;

  html += `<p><b>Alergi terdeteksi:</b> ${alergiList.join(", ")}</p>`;

  html += `<h5 class="mt-4">📅 Meal Plan 7 Hari</h5>`;

  for (let i = 1; i <= 7; i++) {

  const safeSarapan = mealDB.sarapan.filter(m =>
    !alergiList.some(a => m.toLowerCase().includes(a))
  );

  const safeSiang = mealDB.siang.filter(m =>
    !alergiList.some(a => m.toLowerCase().includes(a))
  );

  const safeMalam = mealDB.malam.filter(m =>
    !alergiList.some(a => m.toLowerCase().includes(a))
  );

  // ✅ TARUH DI SINI
  const pick = (arr) => arr.length
    ? arr[i % arr.length]
    : "Menu aman terbatas";

  // ✅ BARU OUTPUT
  html += `
    <p><b>Hari ${i}</b><br>
    Sarapan: ${pick(safeSarapan)}<br>
    Siang: ${pick(safeSiang)}<br>
    Malam: ${pick(safeMalam)}</p>
  `;
}

  const result = document.getElementById("result");
  result.style.display = "block";
  result.innerHTML = html;
  document.getElementById("btnSimpan").style.display = "block";
  document.getElementById("hiddenKondisi").value = penyakit;
  document.getElementById("hiddenAlergi").value = alergiText;

});


</script>
</body>
</html>
