<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - MediCheck</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Background gradasi sama seperti login */
            background: linear-gradient(135deg, #F08787, #FFC7A7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        form {
            background: white;
            padding: 2.5rem; /* Jarak dalam yang lega */
            border-radius: 16px; /* Sudut membulat */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); /* Bayangan halus */
            width: 90%;
            max-width: 400px; /* Lebar maksimal agar tidak terlalu lebar di PC */
            text-align: center;
        }

        h3 {
            color: #F08787; /* Warna tema utama */
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        /* Efek saat kolom diklik */
        input[type="email"]:focus {
            border-color: #F08787;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(240, 135, 135, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #F08787;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        /* Efek hover tombol */
        button:hover {
            background-color: #d66969; /* Jadi agak gelap saat disentuh */
        }

        /* Link kembali */
        .back-link {
            display: block;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
            text-decoration: none;
        }
        
        .back-link:hover {
            color: #F08787;
        }
    </style>
</head>
<body>

    <form method="POST">
        {% csrf_token %}
        
        <h3>Lupa Password</h3>
        
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 20px;">
            Masukkan email yang terdaftar, kami akan mengirimkan kode OTP.
        </p>

        <input type="email" name="email" placeholder="Contoh: user@email.com" required>
        
        <button type="submit">Kirim Kode</button>

        <a href="{% url 'accounts:login' %}" class="back-link">Kembali ke Login</a>
    </form>

</body>
</html>
