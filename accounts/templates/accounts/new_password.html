<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Baru - MediCheck</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Background gradasi pink */
            background: linear-gradient(135deg, #F08787, #FFC7A7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        form {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h3 {
            color: #F08787;
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        p.instruction {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Style untuk Input Password */
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px; /* Jarak antar input */
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        input[type="password"]:focus {
            border-color: #F08787;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(240, 135, 135, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #F08787;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #d66969;
        }
    </style>
</head>
<body>

    <form method="POST">
        {% csrf_token %}
        
        <h3>Buat Password Baru</h3>
        
        <p class="instruction">
            Silakan masukkan password baru kamu. Pastikan password mudah diingat tapi sulit ditebak.
        </p>

        <input type="password" name="password" placeholder="Password Baru" required>
        
        <input type="password" name="confirm_password" placeholder="Ulangi Password Baru" required>
        
        <button type="submit">Simpan Password</button>
    </form>

</body>
</html>
