<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMI</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6f3cff, #b34cff);
            padding: 30px 10px;
        }

        .bmi-container {
            padding: 25px;
            max-width: 520px;
            margin: auto;
            background: white;
            border-radius: 22px;
            box-shadow: 0px 12px 35px rgba(0,0,0,0.15);
            animation: fade 0.4s ease-in-out;
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            color: #4a2cff;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
            margin-top: 5px;
            outline: none;
            font-size: 15px;
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 15px;
            color: #ffffff;
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            backdrop-filter: blur(3px);
        }

        .btn-bmi {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(90deg, #6f3cff, #b34cff);
            border: none;
            padding: 15px;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .hasil-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 16px;
            background: #f8f5ff;
            display: none;
            animation: fade 0.4s ease-in-out;
        }

        @keyframes fade {
            from {opacity: 0; transform: translateY(12px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .judul-hasil {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subjudul {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        ul { padding-left: 20px; }
    </style>
</head>

<body>

  <div class="text-center mt-5">
      <a href="{% url 'accounts:dashboard' %}" class="btn-back">← Kembali ke Dashboard</a>
    </div>


    <div class="bmi-container">

        <h1>Kalkulator BMI</h1>

        <label>Berat Badan (kg)</label>
        <input type="number" id="berat" placeholder="Contoh: 65">

        <label>Tinggi Badan (cm)</label>
        <input type="number" id="tinggi" placeholder="Contoh: 170">

        <label>Riwayat Penyakit</label>
        <select id="riwayat">
            <option value="none">Tidak Ada</option>
            <option value="diabetes">Diabetes</option>
            <option value="hipertensi">Hipertensi</option>
            <option value="kolesterol">Kolesterol Tinggi</option>
            <option value="jantung">Penyakit Jantung</option>
        </select>

        <button class="btn-bmi" onclick="hitungBMI()">🔥 Hitung BMI Saya</button>

        <div id="hasil" class="hasil-card"></div>

    </div>

    <script>
        function hitungBMI() {
            let berat = document.getElementById("berat").value;
            let tinggi = document.getElementById("tinggi").value;
            let penyakit = document.getElementById("riwayat").value;

            if (!berat || !tinggi) {
                alert("Isi berat dan tinggi dulu ya!");
                return;
            }

            tinggi = tinggi / 100;
            let bmi = (berat / (tinggi * tinggi)).toFixed(1);

            let kategori = "";
            if (bmi < 18.5) kategori = "Kurus";
            else if (bmi < 24.9) kategori = "Normal";
            else if (bmi < 29.9) kategori = "Gemuk";
            else kategori = "Obesitas";

            // PENJELASAN PENYAKIT
            let penjelasan = {
                none: "Tidak ada riwayat penyakit.",
                diabetes: "Diabetes membuat tubuh sulit mengontrol kadar gula darah.",
                hipertensi: "Hipertensi adalah tekanan darah tinggi yang bisa memicu stroke.",
                kolesterol: "Kolesterol tinggi dapat menyumbat pembuluh darah.",
                jantung: "Penyakit jantung memengaruhi aliran darah dan fungsi jantung."
            };

            // REKOMENDASI BERDASARKAN PENYAKIT
            let rekom = {
                none: [
                    "Jaga pola makan seimbang.",
                    "Berolahraga 3–4 kali seminggu.",
                    "Minum air putih yang cukup."
                ],
                diabetes: [
                    "Kurangi gula dan nasi putih.",
                    "Perbanyak sayur hijau.",
                    "Hindari minuman manis."
                ],
                hipertensi: [
                    "Kurangi garam.",
                    "Hindari makanan instan.",
                    "Perbanyak buah seperti pisang dan alpukat."
                ],
                kolesterol: [
                    "Hindari gorengan.",
                    "Konsumsi ikan dan makanan tinggi serat.",
                    "Kurangi daging berlemak."
                ],
                jantung: [
                    "Hindari makanan berlemak.",
                    "Kurangi stres dan tidur cukup.",
                    "Lakukan olahraga ringan seperti jalan kaki."
                ]
            };

            // Tampilkan hasil
            let hasilDiv = document.getElementById("hasil");
            hasilDiv.style.display = "block";

            let listRekom = rekom[penyakit].map(r => `<li>${r}</li>`).join("");

            hasilDiv.innerHTML = `
                <div class="judul-hasil">Hasil BMI Kamu</div>
                <p><strong>${bmi}</strong> — ${kategori}</p>

                <div class="subjudul">Penjelasan Penyakit:</div>
                <p>${penjelasan[penyakit]}</p>

                <div class="subjudul">Rekomendasi Untuk Kamu:</div>
                <ul>${listRekom}</ul>
            `;
        }
    </script>
</body>
</html>
