<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator BMI</title>

<style>
* { box-sizing: border-box; }
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #6f3cff, #b34cff);
    padding: 40px 15px;
}
.bmi-container {
    background: #fff;
    max-width: 520px;
    margin: auto;
    padding: 30px;
    border-radius: 24px;
}
label { font-weight: 600; margin-top: 15px; display: block; }
input {
    width: 100%; padding: 14px;
    border-radius: 14px; border: 2px solid #e2e2e2;
}
.btn-bmi {
    width: 100%; margin-top: 20px;
    padding: 15px; border-radius: 16px;
    border: none; font-weight: 600;
}
.btn-hit { background:#6f3cff; color:white; }
.btn-save { background:#00b894; color:white; display:none; }
.hasil-card {
    margin-top: 25px; padding: 22px;
    border-radius: 18px; background:#f8f5ff;
    display:none;
}

.wajib {
    color: #e74c3c;        /* merah */
    font-weight: 600;
    font-size: 12px;
}

.btn-back {
    display: inline-block;
    padding: 8px 14px;
    background: rgba(255,255,255,0.25);
    color: #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
}

.btn-back:hover {
    background: rgba(255,255,255,0.35);
}

</style>
</head>

<body>

    <!--  KEMBALI KE DASHBOARD  -->
<div style="max-width:520px;margin:auto;margin-bottom:15px;">
    <a href="{% url 'accounts:dashboard' %}" class="btn-back">
        ← Kembali ke Dashboard
    </a>
</div>

<form method="POST">
{% csrf_token %}

<div class="bmi-container">
<h1>Kalkulator BMI</h1>

<label>Berat Badan (kg)</label>
<input type="number" id="berat" name="berat" required placeholder="Contoh: 20">
<small class="wajib">* Wajib diisi</small>

<label>Tinggi Badan (cm)</label>
<input type="number" id="tinggi" name="tinggi" required placeholder="Contoh: 150">
<small class="wajib">* Wajib diisi</small>

<label>Riwayat Penyakit</label>
<input type="text" id="riwayat" name="penyakit" required
placeholder="Contoh: diabetes dan sesak nafas">

<button type="button" id="btnHitung" class="btn-bmi btn-hit">🔥 Hitung BMI</button>

<div id="hasil" class="hasil-card"></div>

<button type="submit" id="btnSimpan" class="btn-bmi btn-save">💾 Simpan & Lihat Target Kesehatan</button>

</div>
</form>

<script>
const penyakitData = [
 { label:"Diabetes", aliases:["diabetes"], domain:"metabolic",
   rekom:["Batasi gula","Perbanyak serat"] },
 { label:"Hipertensi", aliases:["hipertensi","darah tinggi"], domain:"cardiovascular",
   rekom:["Kurangi garam","Olahraga rutin"] },
 { label:"Gangguan Pernapasan", aliases:["sesak nafas","asma"], domain:"respiratory",
   rekom:["Hindari asap rokok"] }
];

const domainSources = {
 metabolic:[{name:"WHO",url:"https://www.who.int"}],
 cardiovascular:[{name:"AHA",url:"https://www.heart.org"}],
 respiratory:[{name:"WHO Asthma",url:"https://www.who.int/health-topics/asthma"}]
};

document.getElementById("btnHitung").addEventListener("click", () => {
 const berat = Number(document.getElementById("berat").value);
 const tinggi = Number(document.getElementById("tinggi").value);
 const riwayat = document.getElementById("riwayat").value.toLowerCase();

 if(!berat || !tinggi || !riwayat){
   alert("Semua field wajib diisi");
   return;
 }

 const bmi = (berat / ((tinggi/100)**2)).toFixed(1);
 const kategori = bmi<18.5?"Kurus":bmi<25?"Normal":bmi<30?"Gemuk":"Obesitas";

 let rekom = new Set(), domain = new Set();
 penyakitData.forEach(p=>{
   if(p.aliases.some(a=>riwayat.includes(a))){
     p.rekom.forEach(r=>rekom.add(r));
     domain.add(p.domain);
   }
 });

 const hasil = document.getElementById("hasil");
 hasil.style.display="block";
 hasil.innerHTML=`
   <h3>Hasil BMI</h3>
   <p><b>${bmi}</b> (${kategori})</p>
   <h4>Rekomendasi</h4>
   <ul>${[...rekom].map(r=>`<li>${r}</li>`).join("")}</ul>
   <h4>Sumber</h4>
   <ul>${[...domain].flatMap(d=>domainSources[d]||[])
     .map(s=>`<li><a href="${s.url}" target="_blank">${s.name}</a></li>`).join("")}</ul>
 `;

 document.getElementById("btnSimpan").style.display="block";
});
</script>

</body>
</html>
