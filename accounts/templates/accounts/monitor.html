<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Kesehatan Mental</title>

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #d4f1f4, #e9d5ff);
    padding: 40px 15px;
}

.card {
    background: #fff;
    max-width: 520px;
    margin: auto;
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    text-align: center;
}

h1 {
    color: #7b2cff;
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

.question {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 15px;
}

.btn {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    background: #c4a3ff;
    color: #fff;
}

.btn:hover {
    background: #a88cff;
}

.result {
    margin-top: 25px;
    background: #f8f5ff;
    padding: 20px;
    border-radius: 18px;
    display: none;
}

.back {
    display: inline-block;
    margin-top: 25px;
    text-decoration: none;
    color: #555;
    font-size: 14px;
}
</style>
</head>

<body>
    <form id="mentalForm">
  {% csrf_token %}
</form>


<div class="card">

<h1>💜 Monitor Kesehatan Mental</h1>
<p class="subtitle">Self-check ringan untuk memahami kondisi mentalmu hari ini</p>

<div id="questionBox"></div>

<div id="result" class="result"></div>

<a href="{% url 'accounts:dashboard' %}" class="back">← Kembali ke Dashboard</a>

</div>

<script>
/* ================= DATA PERTANYAAN (DATA-DRIVEN) ================= */
const mentalQuestions = [
    {
        question: "Bagaimana perasaanmu hari ini?",
        options: [
            { text: "😊 Senang & bersemangat", score: 2 },
            { text: "😐 Biasa saja", score: 1 },
            { text: "😞 Kurang bersemangat", score: 0 }
        ]
    },
    {
        question: "Bagaimana kualitas tidurmu semalam?",
        options: [
            { text: "😴 Nyenyak & cukup", score: 2 },
            { text: "😪 Kurang nyenyak", score: 1 },
            { text: "😵 Sulit tidur", score: 0 }
        ]
    },
    {
        question: "Bagaimana energi & motivasimu hari ini?",
        options: [
            { text: "💪 Aktif & produktif", score: 2 },
            { text: "🚶 Cukup", score: 1 },
            { text: "🛌 Sangat lelah / kurang motivasi", score: 0 }
        ]
    }
];

/* ================= ENGINE OTOMATIS ================= */
let currentIndex = 0;
let totalScore = 0;

function renderQuestion() {
    const q = mentalQuestions[currentIndex];
    const box = document.getElementById("questionBox");

    box.innerHTML = `
        <div class="question">${q.question}</div>
        ${q.options.map(
            o => `<button class="btn" onclick="answer(${o.score})">${o.text}</button>`
        ).join("")}
    `;
}

function answer(score) {
    totalScore += score;
    currentIndex++;

    if (currentIndex < mentalQuestions.length) {
        renderQuestion();
    } else {
        showResult();
    }
}

/* ================= OUTPUT DINAMIS ================= */
function showResult() {
    const result = document.getElementById("result");
    result.style.display = "block";

    const maxScore = mentalQuestions.length * 2;
    const ratio = totalScore / maxScore;

    let title = "";
    let message = "";
    let advice = "";

    if (ratio >= 0.75) {
        title = "🌸 Kondisi mentalmu terlihat baik";
        message = "Kamu tampak cukup stabil dan positif hari ini.";
        advice = "Pertahankan rutinitas sehat dan jangan lupa istirahat.";
    } else if (ratio >= 0.45) {
        title = "🌿 Kondisi mentalmu cukup stabil";
        message = "Ada sedikit kelelahan, tapi masih dalam batas wajar.";
        advice = "Coba luangkan waktu untuk relaksasi atau aktivitas yang kamu suka.";
    } else {
        title = "💙 Kamu terlihat sedang lelah secara mental";
        message = "Tidak apa-apa merasa seperti ini, kamu tidak sendirian.";
        advice = "Istirahatlah, dan pertimbangkan berbagi cerita dengan orang terpercaya.";
    }

    result.innerHTML = `
        <h3>${title}</h3>
        <p>${message}</p>
        <p><b>Saran:</b> ${advice}</p>
        <p><small>Catatan: fitur ini bukan alat diagnosis medis.</small></p>
    `;

    document.getElementById("questionBox").innerHTML = "";

    // ================= SIMPAN KE DATABASE =================
    fetch("", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: new URLSearchParams({
            score: totalScore,
            kondisi: title
        })
    });
}

</script>

</body>
</html>
